   FINANCE CLIENT WRAPPER
===================================================== */

function getFinanceSummaryClient(token) {

  return runPromise(
    'getDashboard',
    [token]
  ).then(function(data) {

    return data.finance || {};

  });

}


/* =====================================================
   UI HELPERS
===================================================== */

function statCard(
  label,
  value,
  className
) {

  return `
    <div class="card">

      <div class="stat-label">
        ${label}
      </div>

      <div class="stat-value ${className}">
        ${value}
      </div>

    </div>
  `;

}


function itemCard(item) {

  return `
    <div class="card item-card">

      <div class="item-name">
        ${escapeHTML(item.name)}
      </div>

      <div class="item-stock">
        ${number(item.stock)}
      </div>

      <div class="item-min">
        Minimum: ${number(item.minimum)}
      </div>

      ${statusBadge(item.status)}

    </div>
  `;

}


function statusBadge(status) {

  const value =
    String(status || '')
      .toUpperCase();

  let cls = 'available';

  if (
    value.includes('OUT') ||
    value === 'INACTIVE' ||
    value === 'CANCELLED'
  ) {

    cls = 'out';

  } else if (
    value.includes('LOW') ||
    value === 'PENDING' ||
    value === 'BELUM LUNAS'
  ) {

    cls = 'low';

  } else if (
    value === 'ACTIVE' ||
    value === 'AVAILABLE' ||
    value === 'LUNAS' ||
    value === 'PROCESSED' ||
    value === 'PEMASUKAN'
  ) {

    cls = 'available';

  } else if (
    value === 'PENGELUARAN'
  ) {

    cls = 'out';

  }

  return `
    <span class="status ${cls}">
      ${escapeHTML(value || '-')}
    </span>
  `;

}


function invalidatePageCache() {
  pageCacheClearPages.apply(null, arguments);
}

function loadingHTML() {

  return `
    <div class="card">

      <div class="empty">
        MEMUAT DATA...
      </div>

    </div>
  `;

}


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar() {

  document
    .getElementById('sidebar')
    .classList.toggle('open');

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutApp() {

  google.script.run

    .withSuccessHandler(function() {

      TOKEN = '';
      USER = null;

      storageRemove_(
        'CH_TOKEN'
      );

      showLogin();

    })

    .withFailureHandler(function() {

      TOKEN = '';
      USER = null;

      storageRemove_(
        'CH_TOKEN'
      );

      showLogin();

    })

    .logout(TOKEN);

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function toast(
  message,
  type
) {

  const el =
    document.getElementById(
      'toast'
    );

  el.textContent =
    message;

  el.className =
    'show ' +
    (type || '');

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(function() {

      el.className = '';

    }, 3500);

}


/* =====================================================
   ERROR
===================================================== */

function handleServerError(err) {
  const message = getErrorMessage(err);

  if (isSessionError_(message)) {
    forceLogout_('Sesi berakhir. Silakan login kembali.');
    return;
  }

  toast(message || 'Terjadi kesalahan.', 'error');
}


function isSessionError_(message) {
  const text = String(message || '').toUpperCase();
  // ACCESS_DENIED bukan berarti session expired.
  // Jangan logout user hanya karena permission menu/fungsi ditolak.
  return text.includes('SESSION_REQUIRED') ||
         text.includes('SESSION_EXPIRED');
}

function forceLogout_(message) {
  TOKEN = '';
  USER = null;
  storageRemove_('CH_TOKEN');
  showLogin();

  const error = document.getElementById('loginError');
  if (error && message) {
    error.textContent = message;
    error.style.display = 'block';
  }
}

function getErrorMessage(err) {

  if (!err) {
    return 'Terjadi kesalahan.';
  }

  if (typeof err === 'string') {
    return err;
  }

  return (
    err.message ||
    'Terjadi kesalahan pada server.'
  );

}


/* =====================================================
   FORMATTING
===================================================== */

function money(value) {

  return 'Rp ' +
    Number(value || 0)
      .toLocaleString(
        'id-ID'
      );

}


function number(value) {

  return Number(value || 0)
    .toLocaleString(
      'id-ID'
    );

}


/* =====================================================
   SECURITY / ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeAttr(value) {

  return escapeHTML(value);

}


/* =====================================================
   CLOSE MODAL ON BACKDROP
===================================================== */

document
  .getElementById('modal')
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );

</script>
