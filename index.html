/*

 * Frontend compatibility layer:

 * Every method is routed directly to Supabase RPC `ch_api`.
 */

  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_SqV9oZ7MQ_MMEOar7Nkmjw_wMNnQXfy'

  window.CH_CONFIG.SUPABASE_URL,
  window.CH_CONFIG.SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false
    }
  }
);

(function () {
  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function makeRunner(successHandler, failureHandler) {
    return new Proxy({}, {
      get: function (target, prop) {
        if (prop === 'withSuccessHandler') {
          return function (fn) {
            return makeRunner(
              typeof fn === 'function' ? fn : successHandler,
              failureHandler
            );
          };
        }

        if (prop === 'withFailureHandler') {
          return function (fn) {
            return makeRunner(
              successHandler,
              typeof fn === 'function' ? fn : failureHandler
            );
          };
        }

        if (prop === 'withUserObject') {
          return function () {
            return makeRunner(successHandler, failureHandler);
          };
        }

        if (prop === 'then') return undefined;

        return function () {
          var args = Array.prototype.slice.call(arguments);
          var method = String(prop);
          var token = (typeof TOKEN !== 'undefined' && TOKEN)
            ? TOKEN
            : (localStorage.getItem('CH_TOKEN') || '');

          window.CH_SUPABASE
            .rpc('ch_api', {
              p_method: method,
              p_args: args,
              p_token: method.toUpperCase() === 'LOGIN' ? '' : token
            })
            .then(function (response) {
              if (response.error) {
                throw response.error;
              }

              var data = response.data;

              if (data && data.success === false) {
                throw new Error(data.message || 'Terjadi kesalahan pada server.');
              }

              /*
               * Keep the old Google Apps Script return contract:
               * arrays stay arrays; objects stay objects.
               */
              if (typeof successHandler === 'function') {
                successHandler(data);
              }
            })
            .catch(function (err) {
              var message =
                err && (
                  err.message ||
                  err.details ||
                  err.hint
                )
                  ? (
                    err.message ||
                    err.details ||
                    err.hint
                  )
                  : 'Terjadi kesalahan pada Supabase.';

              var error = new Error(message);

              if (typeof failureHandler === 'function') {
                failureHandler(error);
              } else {
                console.error(error);
              }
            });
        };
      }
    });
  }

  /*
   * Existing HTML intentionally keeps this namespace so we do not
   * have to rewrite hundreds of UI handlers. It is NOT Apps Script.
   */
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  window.google.script.run = makeRunner(null, null);

  window.CH_ARRAY = asArray;

<script>

/* =====================================================
   GLOBAL
===================================================== */

function storageGet_(key) {
  try {
    return window.localStorage.getItem(key) || '';
  } catch (e) {
    return '';
  }
}

function storageSet_(key, value) {
  try {
    window.localStorage.setItem(key, value);
  } catch (e) {}
}

function storageRemove_(key) {
  try {
    window.localStorage.removeItem(key);
  } catch (e) {}
}

let TOKEN = storageGet_('CH_TOKEN');
let USER = null;
let PERMISSIONS = {};
let FINANCE_REPORT = null;

let CURRENT_ITEMS = [];
let CURRENT_MEMBERS = [];
let CURRENT_USERS = [];

const LOGO_1 = 'assets/logo.png';

const BEARNAD_WELCOME =
  'assets/background.png';

const LOGO_2 = LOGO_1;

const BEARNAD_AVATAR = 'assets/bearnad.png';



/* =====================================================
   INIT
===================================================== */

window.addEventListener('load', function() {

  setTimeout(function() {

    document
      .getElementById('loader')
      .classList.add('hidden');

  }, 700);


  if (TOKEN) {

    google.script.run
      .withSuccessHandler(function(profile) {

        USER = profile;

        openApp();

      })
      .withFailureHandler(function(err) {

        const message = getErrorMessage(err);

        TOKEN = '';
        USER = null;
        storageRemove_('CH_TOKEN');
        showLogin();

        const error = document.getElementById('loginError');
        if (error && message) {
          error.textContent =
            isSessionError_(message)
              ? 'Sesi lama sudah tidak valid. Silakan login kembali.'
              : message;
          error.style.display = 'block';
        }

      })
      .getMyProfile(TOKEN);

  } else {

    showLogin();

  }

});


/* =====================================================
   LOGIN
===================================================== */

function handleLogin(event) {

  event.preventDefault();

  const username =
    document
      .getElementById('loginUsername')
      .value;

  const password =
    document
      .getElementById('loginPassword')
      .value;

  const button =
    document
      .getElementById('loginButton');

  const error =
    document
      .getElementById('loginError');

  button.disabled = true;
  button.textContent = 'MEMERIKSA...';

  error.style.display = 'none';

  google.script.run

    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.textContent = 'MASUK';

      if (!result.success) {

        error.textContent =
          result.message ||
          'Login gagal.';

        error.style.display =
          'block';

        return;

      }

      TOKEN =
        result.token;

      USER =
        result.user;

      storageSet_(
        'CH_TOKEN',
        TOKEN
      );

      openApp();

    })

    .withFailureHandler(function(err) {

      button.disabled = false;
      button.textContent = 'MASUK';

      error.textContent =
        getErrorMessage(err);

      error.style.display =
        'block';

    })

    .login(
      username,
      password
    );

}


/* =====================================================
   OPEN APP
===================================================== */

function getUserAvatar_() {
  const name = String((USER && USER.nama) || '').toLowerCase();
  const username = String((USER && (USER.username || USER.user)) || '').toLowerCase();

  const identity = name + ' ' + username;

  if (identity.includes('bearnad')) return 'assets/bearnad.png';
  if (identity.includes('helix')) return 'assets/helix.png';
  if (identity.includes('jaene')) return 'assets/jaene.png';

  return '';
}

function syncAvatarUI_() {
  const avatar = document.getElementById('sidebarAvatar');
  if (!avatar) return;

  const src = getUserAvatar_();
  avatar.src = src;
  avatar.style.display = src ? 'block' : 'none';
}


/* =====================================================
   OPEN APP
===================================================== */

function openApp() {

  document
    .getElementById('loginPage')
    .style.display = 'none';

  document
    .getElementById('app')
    .style.display = 'block';

  syncAvatarUI_();

  document
    .getElementById('sidebarName')
    .textContent =
      USER.nama;

  document
    .getElementById('sidebarRole')
    .textContent =
      USER.role;

  document
    .getElementById('sidebarUserRole')
    .textContent =
      USER.role;

  loadPermissions();

}


function showLogin() {

  document
    .getElementById('loginPage')
    .style.display = 'flex';

  document
    .getElementById('app')
    .style.display = 'none';

}


/* =====================================================
   PERMISSIONS
===================================================== */

function loadPermissions() {

  google.script.run

    .withSuccessHandler(function(data) {

      PERMISSIONS =
        data || {};

      buildNavigation();

      /*
       * MAGANG sekarang masuk ke DASHBOARD terlebih dahulu,
       * supaya welcome/dashboard khusus MAGANG tampil.
       * Akses modul lain tetap mengikuti PERMISSIONS/backend.
       */
      if (USER && String(USER.role || '').toUpperCase() === 'MAGANG') {

        showPage(
          'dashboard',
          'DASHBOARD'
        );

      } else if (USER && String(USER.role || '').toUpperCase() === 'MEMBER') {

        showPage(
          'pickup',
          'PENGAMBILAN BARANG'
        );

      } else {

        showPage(
          'dashboard',
          'DASHBOARD'
        );

      }

    })

    .withFailureHandler(handleServerError)

    .getPermissions(TOKEN);

}


/* =====================================================
   NAVIGATION
===================================================== */

function buildNavigation() {

  const nav = document.getElementById('navigation');
  let html = '';

  if (PERMISSIONS.dashboard) {
    html += navButton('dashboard', '⌂', 'DASHBOARD');
  }

  if (
    PERMISSIONS.stock ||
    PERMISSIONS.masuk ||
    PERMISSIONS.keluar
  ) {
    html += `<div class="nav-section">INVENTORY</div>`;
  }

  if (PERMISSIONS.stock) {
    html += navButton('stock', '▣', 'STOCK BRANGKAS');
  }

  if (PERMISSIONS.masuk) {
    html += navButton('stockin', '↑', 'BARANG MASUK');
  }

  if (PERMISSIONS.pickup || PERMISSIONS.party) {
    html += `<div class="nav-section">OPERASIONAL</div>`;
  }

  if (PERMISSIONS.pickup) {
    html += navButton('pickup', '↓', 'BARANG KELUAR & PENGAMBILAN');
  }

  if (PERMISSIONS.party) {
    html += navButton('party', '♜', 'EVENT');
  }

  if (PERMISSIONS.kerjasama) {
    html += navButton('kerjasama', '🤝', 'PARTNERSHIP');
  }

  if (PERMISSIONS.finance) {
    html += navButton('finance', '◆', 'LAPORAN KEUANGAN');
  }

  // Kasbon & Setoran tetap tersedia sebagai modul operasional terpisah.
  if (PERMISSIONS.kasbon) {
    html += navButton(
      'kasbon',
      '◇',
      USER && String(USER.role).toUpperCase() === 'MAGANG'
        ? 'Kasbon Saya'
        : 'Kasbon & Setoran'
    );
  }

  if (PERMISSIONS.members || PERMISSIONS.history) {
    html += `<div class="nav-section">MANAGEMENT</div>`;
  }

  if (PERMISSIONS.members) {
    html += navButton('members', '♙', 'MEMBERS');
  }

  if (PERMISSIONS.history) {
    html += navButton('history', '☷', 'HISTORY');
  }

  if (PERMISSIONS.accounts) {
    html += `<div class="nav-section">SYSTEM</div>`;
    html += navButton('accounts', '⚙', 'MANAJEMEN AKUN');
  }

  html += `<div class="nav-section">INFORMASI</div>`;
  html += navButton('rules', '⚖', 'PERATURAN');

  html += `<div class="nav-section">AKUN</div>`;
  html += navButton('profile', '●', 'PROFIL & PASSWORD');

  nav.innerHTML = html;
}


function navButton(
  page,
  icon,
  title
) {

  return `
    <button
      class="nav-item"
      data-page="${page}"
      onclick="showPage('${page}', '${title}')"
    >
      <span>${icon}</span>
      <span>${title}</span>
    </button>
  `;

}


/* =====================================================
   PAGE ROUTER
===================================================== */

/* =====================================================
   ULTRA RESPONSIVE PAGE ROUTER
   - Never blanks the page while navigating.
   - Keeps the previous content visible while Apps Script loads.
   - Prevents a slow previous request from overwriting the newest page.
   - Keeps a small HTML cache for instant revisits.
===================================================== */
const PAGE_CACHE = Object.create(null);
const PAGE_CACHE_TTL = 8000;
const PAGE_CACHEABLE = new Set([
  'dashboard', 'stock', 'finance', 'members', 'history', 'rules'
]);
let CURRENT_PAGE = '';
let PAGE_NAV_SEQ = 0;
let PAGE_LOADING = false;
let PAGE_CACHE_OBSERVER = null;
let PAGE_CACHE_SAVE_TIMER = null;

function pageCacheGet(page) {
  if (!PAGE_CACHEABLE.has(page)) return null;
  const item = PAGE_CACHE[page];
  if (!item) return null;
  if (Date.now() - item.time > PAGE_CACHE_TTL) {
    delete PAGE_CACHE[page];
    return null;
  }
  return item.html;
}

function pageCacheSave(page) {
  if (!PAGE_CACHEABLE.has(page)) return;
  const content = document.getElementById('content');
  if (!content || !content.innerHTML.trim()) return;
  PAGE_CACHE[page] = {
    html: content.innerHTML,
    time: Date.now()
  };
}

function pageCacheClear() {
  Object.keys(PAGE_CACHE).forEach(function(key) {
    delete PAGE_CACHE[key];
  });
}

function pageCacheClearPages() {
  Array.prototype.slice.call(arguments).forEach(function(page) {
    delete PAGE_CACHE[page];
  });
}

function setPageBusy_(busy) {
  PAGE_LOADING = !!busy;
  const content = document.getElementById('content');
  if (content) content.classList.toggle('page-loading', !!busy);
}

function watchPageCache_(page) {
  if (PAGE_CACHE_OBSERVER) {
    PAGE_CACHE_OBSERVER.disconnect();
    PAGE_CACHE_OBSERVER = null;
  }
  clearTimeout(PAGE_CACHE_SAVE_TIMER);
  PAGE_CACHE_SAVE_TIMER = null;

  if (!PAGE_CACHEABLE.has(page)) return;

  const content = document.getElementById('content');
  if (!content) return;

  PAGE_CACHE_OBSERVER = new MutationObserver(function() {
    clearTimeout(PAGE_CACHE_SAVE_TIMER);
    PAGE_CACHE_SAVE_TIMER = setTimeout(function() {
      if (CURRENT_PAGE === page) pageCacheSave(page);
    }, 120);
  });

  PAGE_CACHE_OBSERVER.observe(content, {
    childList: true,
    subtree: true
  });
}

function showPage(page, title) {
  const protectedPermission = {
    dashboard: 'dashboard',
    stock: 'stock',
    stockin: 'masuk',
    stockout: 'pickup',
    pickup: 'pickup',
    party: 'party',
    kerjasama: 'kerjasama',
    kasbon: 'kasbon',
    finance: 'finance',
    members: 'members',
    history: 'history',
    accounts: 'accounts'
  };

  const requiredPermission = protectedPermission[page];

  /* Dashboard MAGANG adalah halaman welcome internal.
     Kartu di dalamnya tetap hanya dibuat dari PERMISSIONS. */
  const isMagangDashboard =
    page === 'dashboard' &&
    USER &&
    String(USER.role || '').toUpperCase() === 'MAGANG';

  if (requiredPermission && !PERMISSIONS[requiredPermission] && !isMagangDashboard) {
    toast('Akses ke halaman ini tidak tersedia untuk role ' + (USER && USER.role ? USER.role : '') + '.', 'error');
    return;
  }

  const content = document.getElementById('content');
  const previousPage = CURRENT_PAGE;
  const navSeq = ++PAGE_NAV_SEQ;

  // Save the current page before switching away from it.
  if (previousPage && previousPage !== page) pageCacheSave(previousPage);

  CURRENT_PAGE = page;
  watchPageCache_(page);

  document.querySelectorAll('.nav-item').forEach(function(button) {
    button.classList.toggle('active', button.dataset.page === page);
  });

  const pageTitle = document.getElementById('pageTitle');
  if (pageTitle) pageTitle.textContent = title;

  document.getElementById('sidebar').classList.remove('open');

  // IMPORTANT: do NOT replace content with a full loading screen.
  // Restore cached HTML instantly when available; otherwise keep the
  // previous screen visible until the new data arrives.
  const cached = pageCacheGet(page);
  if (cached) {
    content.innerHTML = cached;
    // Stock has one dynamically attached search listener; rebuild it immediately.
    if (page === 'stock' && typeof renderStockPage_ === 'function' && CURRENT_ITEMS && CURRENT_ITEMS.length) {
      renderStockPage_('');
    }
  } else if (!content.innerHTML.trim()) {
    content.innerHTML = loadingHTML();
  }

  setPageBusy_(true);

  function safeDone() {
    if (navSeq === PAGE_NAV_SEQ) setPageBusy_(false);
  }

  // Route-specific loaders. The existing functions remain untouched.
  // A loader response is responsible for rendering its page as before.
  switch(page) {
    case 'dashboard':
      loadDashboardPage();
      break;
    case 'stock':
      loadStockPage();
      break;
    case 'stockin':
      loadStockInPage();
      break;
    case 'stockout':
    case 'pickup':
      loadPickupPage();
      break;
    case 'party':
      loadPartyPage();
      break;
    case 'kerjasama':
      loadPartnershipPage();
      break;
    case 'kasbon':
      loadKasbonPage();
      break;
    case 'finance':
      loadFinancePage();
      break;
    case 'members':
      loadMembersPage();
      break;
    case 'history':
      loadHistoryPage();
      break;
    case 'accounts':
      loadAccountsPage();
      break;
    case 'rules':
      loadRulesPage();
      break;
    case 'profile':
      loadProfilePage();
      break;
    default:
      loadDashboardPage();
      break;
  }

  // If a loader is synchronous, clear the busy state on the next frame.
  // Async loaders that finish later will simply leave the visual content intact.
  requestAnimationFrame(function() {
    if (navSeq === PAGE_NAV_SEQ && content && content.innerHTML.trim()) {
      pageCacheSave(page);
      safeDone();
    }
  });
}

    USER &&
    ['ADMIN', 'STAFF'].indexOf(
      String(USER.role || '').toUpperCase()
    ) !== -1;
  const filtered = CURRENT_ITEMS.filter(function(item) {
    return String(item.name || '').toLowerCase().includes(q);

  let cards = '';

  filtered.forEach(function(item) {
    cards += `
      <div class="card item-card" data-stock-name="${escapeAttr(item.name)}">
        <div class="item-top">
          <div class="item-icon">▣</div>
          <div class="item-name">${escapeHTML(item.name)}</div>

        <div class="item-stock">${number(item.stock)}<span class="item-stock-unit">UNIT</span></div>

        ${canQuickStock ? `
          <div class="item-quick-stock">
            <span class="quick-stock-label">TAMBAH STOK CEPAT</span>
            <input
              id="quickStockQty_${escapeAttr(item.id)}"

              onclick="quickStockOut('${escapeAttr(item.id)}')"
              title="Kurangi stok"

            <button
              type="button"

              onclick="quickAddStock('${escapeAttr(item.id)}')"

            class="btn btn-muted item-edit"

    cardsContainer.innerHTML = cards;

      countEl.textContent = filtered.length + ' barang';

    return;
  }

  document.getElementById('content').innerHTML = `
    <div class="stock-toolbar">
      <div class="stock-search-wrap">
        <span class="stock-search-icon">⌕</span>
        <input id="stockSearch" class="stock-search" type="search" placeholder="Cari nama barang..." autocomplete="off" spellcheck="false">

    </div>
    <div id="stockCards" class="grid grid-4">${cards}</div>`;

  if (input) {
    input.value = query || '';
    input.addEventListener('input', function() {
      renderStockPage_(this.value);
    });
  }
}

  const dataPromises = [
    getItemsPromise(),
    getStaffPromise()

    dataPromises.push(getMembersPromise());
  }

  Promise.all(dataPromises)
    .then(function(results) {
      if (CURRENT_PAGE !== 'pickup') return;

      const items = results[0] || [];
      const staff = results[1] || [];
      const members = privileged ? (results[2] || []) : [];

      let itemOptions = '';

      let memberOptions = '';

        itemOptions += `

function submitPickup() {

  const privileged =
    USER &&
    (
      String(USER.role || '').toUpperCase() === 'ADMIN' ||
      String(USER.role || '').toUpperCase() === 'MANAGER' ||
      String(USER.role || '').toUpperCase() === 'STAFF'
    );

  const item = document.getElementById('pickupItem').value;
  const qty = document.getElementById('pickupQty').value;
  const staff = document.getElementById('pickupStaff').value;
  const note = document.getElementById('pickupNote').value;
  const member = privileged && document.getElementById('pickupMember')
    ? document.getElementById('pickupMember').value
    : '';

  if (privileged && !member) {
    toast('Pilih Member/Pengambil terlebih dahulu.', 'error');
    return;
  }

  if (!item) {
    toast('Pilih barang terlebih dahulu.', 'error');
    return;
  }

  if (!qty || Number(qty) <= 0) {
    toast('Jumlah harus lebih dari 0.', 'error');
    return;
  }

  if (!staff) {
    toast('Pilih ADMIN / MANAGER / STAFF sebagai penyerah.', 'error');
    return;
  }
  if (!String(note || '').trim()) {
    toast('Keterangan wajib diisi untuk setiap pengambilan barang.', 'error');
    document.getElementById('pickupNote').focus();
    return;
  }

  google.script.run
    .withSuccessHandler(function(result) {
      toast(
        result.message || 'Barang keluar berhasil dicatat.',
        'success'
      );
      loadPickupPage();
    })
    .withFailureHandler(handleServerError)
    .recordBarangKeluar(
      TOKEN,
      item,
      qty,
      staff,
      note,
      member
    );
}

  const button =
    document.getElementById('partySaveButton');

  const tanggal =
    document.getElementById('partyTanggal').value;

  const nama =
    document.getElementById('partyNama').value.trim();

  const jumlah =
    document.getElementById('partyJumlah').value;

  const dpWd =
    document.getElementById('partyDpWd').value;

  const namaPJ =
    document.getElementById('partyNamaPJ').value.trim();

  const keterangan =
    document.getElementById('partyKeterangan').value.trim();

      'Tanggal, Nama, Jumlah, DP/WD, dan Nama PJ wajib diisi.',
      'error'
    );
    return;

  button.disabled = true;
  button.textContent = 'MENYIMPAN...';

  google.script.run
    .withSuccessHandler(function(result) {

      button.disabled = false;
      button.textContent = 'SIMPAN EVENT';

      toast(
        result.message || 'Data Event berhasil disimpan.',
        'success'

      button.textContent = 'SIMPAN EVENT';

function loadKasbonPage() {

  Promise.all([
    getKasbonPromise(),
    getKasbonHistoryPromise()
  ])
  .then(function(results) {
      if (CURRENT_PAGE !== 'kasbon') return;

    const balances = results[0] || [];
    const history = results[1] || [];

    // MAGANG hanya mendapatkan halaman baca-saja miliknya sendiri.
    // Backend sudah memfilter data berdasarkan session.memberId.
    if (USER && String(USER.role).toUpperCase() === 'MAGANG') {
      renderKasbonMagangReadOnly(balances, history);
      return;
    }

    let kasbonOptions = '';
    let setoranOptions = '';

    balances.forEach(function(row) {

      kasbonOptions += `
        <option value="${escapeAttr(row.memberId)}">
          ${escapeHTML(row.memberName)}
          — Sisa ${money(row.remaining)}
        </option>
      `;

      if (Number(row.remaining) > 0) {
        setoranOptions += `
          <option value="${escapeAttr(row.memberId)}"
                  data-remaining="${Number(row.remaining)}">
            ${escapeHTML(row.memberName)}
            — Sisa ${money(row.remaining)}
          </option>
        `;
      }

    });

    if (!setoranOptions) {
      setoranOptions = `
        <option value="" disabled selected>
          Tidak ada kasbon yang bisa disetor
        </option>
      `;
    }

    /*
     * Satu member = satu tabel.
     * Hanya member yang benar-benar memiliki kasbon yang ditampilkan.
     */
    const activeBalances = balances.filter(function(row) {
      return Number(row.totalKasbon) > 0;
    });

    window.__KASBON_BALANCES = balances;

    const grouped = {};

    activeBalances.forEach(function(row) {
      grouped[String(row.memberId)] = {
        balance: row,
        history: []
      };
    });

    history.forEach(function(row) {
      const key = String(row.memberId);
      if (grouped[key]) {
        grouped[key].history.push(row);
      }
    });

    let memberTables = '';

    activeBalances.forEach(function(row) {

      const key = String(row.memberId);
      const memberData = grouped[key];
      const memberHistory = memberData.history || [];

      let rows = '';

      memberHistory.forEach(function(item) {

        const isKasbon =
          String(item.type || '').toUpperCase() === 'KASBON';

        rows += `
          <tr>
            <td class="kasbon-date">
              ${escapeHTML(item.timestamp || '-')}
            </td>

            <td>
              <span class="kasbon-type ${isKasbon ? 'type-kasbon' : 'type-setoran'}">
                ${isKasbon ? 'KASBON' : 'SETORAN'}
              </span>
            </td>

            <td class="${isKasbon ? 'amount-kasbon' : 'amount-setoran'}">
              ${isKasbon ? '+' : '-'} ${money(item.amount)}
            </td>

            <td>
              ${escapeHTML(item.keterangan || '-')}
            </td>

            <td>
              ${escapeHTML(item.nama || '-')}
            </td>
          </tr>
        `;

      });

      if (!rows) {
        rows = `
          <tr>
            <td colspan="5">
              <div class="empty">
                Belum ada riwayat transaksi.
              </div>
            </td>
          </tr>
        `;
      }

      memberTables += `
        <section class="kasbon-person-card">

          <div class="kasbon-person-head">

            <div class="kasbon-person-identity">
              <div class="kasbon-person-avatar">
                ${escapeHTML(
                  String(row.memberName || '?')
                    .trim()
                    .charAt(0)
                    .toUpperCase()
                )}
              </div>

              <div>
                <div class="kasbon-person-name">
                  ${escapeHTML(row.memberName)}
                </div>

                <div class="kasbon-person-rank">
                  ${escapeHTML(row.rank || 'MEMBER')}
                </div>
              </div>
            </div>

            <div class="kasbon-person-actions">
              <button
                class="kasbon-mini-btn kasbon-mini-red"
                onclick="focusKasbonMember('${escapeAttr(row.memberId)}')"
                type="button"
              >
                + KASBON
              </button>

              ${
                Number(row.remaining) > 0
                  ? `
                    <button
                      class="kasbon-mini-btn kasbon-mini-green"
                      onclick="focusSetoranMember('${escapeAttr(row.memberId)}')"
                      type="button"
                    >
                      + SETORAN
                    </button>
                  `
                  : ''
              }

              <button
                class="kasbon-mini-btn kasbon-mini-delete"
                onclick="deleteKasbonPerson('${escapeAttr(row.memberId)}')"
                type="button"
              >
                HAPUS
              </button>
            </div>

          </div>

          <div class="kasbon-summary-grid">

            <div class="kasbon-summary kasbon-summary-red">
              <span>Total Kasbon</span>
              <strong>${money(row.totalKasbon)}</strong>
            </div>

            <div class="kasbon-summary kasbon-summary-green">
              <span>Total Setoran</span>
              <strong>${money(row.totalSetoran)}</strong>
            </div>

            <div class="kasbon-summary kasbon-summary-gold">
              <span>Sisa</span>
              <strong>${money(row.remaining)}</strong>
            </div>

            <div class="kasbon-summary kasbon-summary-status">
              <span>Status</span>
              <strong>${statusBadge(row.status)}</strong>
            </div>

          </div>

          <div class="kasbon-table-wrap">

            <table class="kasbon-person-table">

              <thead>
                <tr>
                  <th>Waktu</th>
                  <th>Jenis</th>
                  <th>Nominal</th>
                  <th>Keterangan</th>
                  <th>Dicatat Oleh</th>
                </tr>
              </thead>

              <tbody>
                ${rows}
              </tbody>

            </table>

          </div>

        </section>
      `;

    });

    if (!memberTables) {
      memberTables = `
        <div class="kasbon-empty-state">
          <div class="kasbon-empty-icon">◇</div>
          <strong>Belum ada kasbon</strong>
          <span>
            Belum ada member yang memiliki data kasbon.
          </span>
        </div>
      `;
    }

    document
      .getElementById('content')
      .innerHTML = `

      <div class="kasbon-page-head">

        <div>
          <div class="section-title" style="margin-top:0">
            KASBON & SETORAN
          </div>

          <div class="kasbon-page-subtitle">
            Kelola transaksi berdasarkan masing-masing member.
          </div>
        </div>

        <div class="kasbon-person-count">
          <strong>${activeBalances.length}</strong>
          <span>MEMBER KASBON</span>
        </div>

      </div>

      <div class="grid grid-2">

        <div class="card kasbon-form-card">

          <div class="section-title" style="margin-top:0">
            CATAT KASBON
          </div>

          <div class="field">
            <label>Member</label>

            <select id="kasbonMember">
              ${kasbonOptions || `
                <option value="" disabled selected>
                  Belum ada member
                </option>
              `}
            </select>
          </div>

          <div class="field">
            <label>Nominal</label>

            <input
              id="kasbonAmount"
              type="number"
              min="1"
              placeholder="0"
            >
          </div>

          <div class="field">
            <label>Keterangan</label>

            <textarea id="kasbonNote"></textarea>
          </div>

          <button
            class="btn btn-red"
            onclick="submitKasbon()"
            type="button"
          >
            SIMPAN KASBON
          </button>

        </div>

        <div class="card kasbon-form-card">

          <div class="section-title" style="margin-top:0">
            CATAT SETORAN
          </div>

          <div class="field">
            <label>Member</label>

            <select
              id="setoranMember"
              onchange="updateSetoranLimit()"
            >
              ${setoranOptions}
            </select>
          </div>

          <div class="field">
            <label>Nominal</label>

            <input
              id="setoranAmount"
              type="number"
              min="1"
              step="1"
              placeholder="0"
              oninput="validateSetoranAmount()"
            >

            <div id="setoranLimit" class="field-hint"></div>
          </div>

          <div class="field">
            <label>Keterangan</label>

            <textarea id="setoranNote"></textarea>
          </div>

          <button
            id="setoranButton"
            class="btn btn-green"
            onclick="submitSetoran()"
            type="button"
          >
            SIMPAN SETORAN
          </button>

        </div>

      </div>

      <div class="kasbon-list-head">
        <div>
          <div class="section-title" style="margin:0">
            DATA PER MEMBER
          </div>
          <div class="kasbon-list-desc">
            Setiap member memiliki tabel transaksi sendiri.
          </div>
        </div>
      </div>

      <div class="kasbon-person-list">
        ${memberTables}
      </div>

    `;

    updateSetoranLimit();

  })
  .catch(handleServerError);

}


function focusKasbonMember(memberId) {

  const select = document.getElementById('kasbonMember');

  if (!select) return;

  select.value = String(memberId);

  const amount = document.getElementById('kasbonAmount');

  if (amount) {
    amount.focus();
    amount.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }

}


function focusSetoranMember(memberId) {

  const select = document.getElementById('setoranMember');

  if (!select) return;

  select.value = String(memberId);
  updateSetoranLimit();

  const amount = document.getElementById('setoranAmount');

  if (amount) {
    amount.focus();
    amount.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }

}


function deleteKasbonPerson(memberId) {

  const balances = window.__KASBON_BALANCES || [];

  const row = balances.find(function(item) {
    return String(item.memberId) === String(memberId);
  });

  const memberName =
    row && row.memberName
      ? row.memberName
      : 'member ini';

  if (!confirm(
    'Hapus seluruh tabel Kasbon & Setoran untuk "' +
    memberName +
    '"?\n\n' +
    'Semua transaksi kasbon dan setoran milik member ini akan dihapus dari sheet. ' +
    'Tindakan ini tidak dapat dibatalkan.'
  )) {
    return;
  }

  google.script.run
    .withSuccessHandler(function(result) {

      toast(
        result.message || 'Data kasbon berhasil dihapus.',
        'success'
      );

      loadKasbonPage();

    })
    .withFailureHandler(handleServerError)
    .deleteKasbonPerson(
      TOKEN,
      memberId
    );

}


function submitKasbon() {

  google.script.run

    .withSuccessHandler(function(result) {

      toast(
        result.message ||
        'Kasbon berhasil.',
        'success'
      );

      loadKasbonPage();

    })

    .withFailureHandler(handleServerError)

    .addKasbon(
      TOKEN,
      document.getElementById('kasbonMember').value,
      document.getElementById('kasbonAmount').value,
      document.getElementById('kasbonNote').value,
      USER.nama
    );

}


function updateSetoranLimit() {
  const select = document.getElementById('setoranMember');
  const amount = document.getElementById('setoranAmount');
  const hint = document.getElementById('setoranLimit');
  const button = document.getElementById('setoranButton');

  if (!select || !amount || !hint || !button) return;

  const option = select.options[select.selectedIndex];
  const remaining = Number(option && option.dataset.remaining) || 0;

  amount.max = remaining > 0 ? String(remaining) : '';
  hint.textContent = remaining > 0
    ? 'Maksimal setoran: ' + money(remaining)
    : 'Tidak ada sisa kasbon.';

  validateSetoranAmount();
}

function validateSetoranAmount() {
  const select = document.getElementById('setoranMember');
  const amount = document.getElementById('setoranAmount');
  const button = document.getElementById('setoranButton');

  if (!select || !amount || !button) return false;

  const option = select.options[select.selectedIndex];
  const remaining = Number(option && option.dataset.remaining) || 0;
  const value = Number(amount.value) || 0;

  const valid = remaining > 0 && value > 0 && value <= remaining;
  button.disabled = !valid;

  if (value > remaining && remaining > 0) {
    amount.setCustomValidity('Nominal melebihi sisa kasbon.');
  } else {
    amount.setCustomValidity('');
  }

  return valid;
}

function submitSetoran() {

  if (!validateSetoranAmount()) {
    toast('Nominal setoran melebihi sisa kasbon atau belum diisi.', 'error');
    return;
  }

  const button = document.getElementById('setoranButton');
  button.disabled = true;
  button.textContent = 'MENYIMPAN...';

  google.script.run
    .withSuccessHandler(function(result) {
      toast(
        result.message || 'Setoran berhasil.',
        'success'
      );
      loadKasbonPage();
    })
    .withFailureHandler(function(err) {
      button.disabled = false;
      button.textContent = 'SIMPAN SETORAN';
      handleServerError(err);
      loadKasbonPage();
    })
    .addSetoran(
      TOKEN,
      document.getElementById('setoranMember').value,
      document.getElementById('setoranAmount').value,
      document.getElementById('setoranNote').value,
      USER.nama
    );

}

function submitKeuangan() {

  const type = document.getElementById('financeType').value;
  const amount = document.getElementById('financeAmount').value;
  const note = document.getElementById('financeNote').value;

  if (!amount || Number(amount) <= 0) {
    toast('Nominal harus lebih dari 0.', 'error');
    return;
  }

  if (!String(note || '').trim()) {
    toast('Keterangan wajib diisi.', 'error');
    return;
  }

  google.script.run
    .withSuccessHandler(function(result) {
      toast(result.message || 'Transaksi berhasil disimpan.', 'success');
      loadFinancePage();
    })
    .withFailureHandler(handleServerError)
    .addKeuanganTransaction(
      TOKEN,
      type,
      amount,
      note
    );
}

function cekDuplikatKeuangan() {

  const box = document.getElementById('keuanganDuplicateBox');

  if (box) {
    box.innerHTML = '<div class="card"><div class="empty">MEMERIKSA DATA...</div></div>';
  }

  google.script.run
    .withSuccessHandler(function(list) {

      list = list || [];

      if (!box) return;

      if (!list.length) {
        box.innerHTML = `
          <div class="card duplicate-clean">
            <strong>✓ TIDAK ADA KANDIDAT DUPLIKAT</strong>
            <div>Semua transaksi yang diperiksa tidak menunjukkan pasangan yang sama.</div>
          </div>
        `;
        return;
      }

      let html = `
        <div class="card duplicate-card">
          <div class="section-title" style="margin-top:0">
            ⚠ KANDIDAT DATA DUPLIKAT
          </div>
          <div class="duplicate-note">
            Sistem hanya menandai data yang sama jenis, nominal, keterangan,
            input oleh, dan tercatat dalam rentang 24 jam. Kamu tetap menentukan
            transaksi mana yang benar-benar salah.
          </div>
      `;

      list.forEach(function(pair, index) {

        function duplicateRow(item) {
          return `
            <div class="duplicate-row">
              <div>
                <strong>${escapeHTML(item.id)}</strong>
                <span>${escapeHTML(item.tanggal)}</span>
              </div>
              <div>${escapeHTML(item.jenis)} • ${money(item.nominal)}</div>
              <div>${escapeHTML(item.keterangan)}</div>
              <div>${escapeHTML(item.inputOleh)}</div>
              <button class="btn btn-muted" onclick="deleteKeuangan('${escapeAttr(item.id)}')">
                HAPUS ${escapeHTML(item.id)}
              </button>
            </div>
          `;
        }

        html += `
          <div class="duplicate-pair">
            <div class="duplicate-pair-title">PASANGAN ${index + 1}</div>
            ${duplicateRow(pair.first)}
            ${duplicateRow(pair.second)}
          </div>
        `;
      });

      html += '</div>';
      box.innerHTML = html;
    })
    .withFailureHandler(handleServerError)
    .getKeuanganDuplicateCandidates(TOKEN);
}

function loadHistoryPage() {

  Promise.all([
    getHistoryPromise(),
    getPickupHistoryPromise(),
    runPromise('getAuditHistory', [TOKEN]),
    getFinanceHistoryPromise()
  ])
  .then(function(results) {
    if (CURRENT_PAGE !== 'history') return;

    const transactions = Array.isArray(results[0]) ? results[0] : [];
    const pickups = Array.isArray(results[1]) ? results[1] : [];
    const auditRows = Array.isArray(results[2]) ? results[2] : [];
    const financeRows = Array.isArray(results[3]) ? results[3] : [];
    const all = [];
    const auditKnownIds = new Set();

    function safeJson(value) {
      if (!value) return {};
      if (typeof value === 'object') return value;
      try { return JSON.parse(value); } catch (e) { return {}; }
    }

    function findIds(value, out) {
      if (!value || typeof value !== 'object') return;
      Object.keys(value).forEach(function(key) {
        const v = value[key];
        if (v && typeof v === 'object') findIds(v, out);
        else if (v !== null && v !== undefined && /(^id$|_id$|Id$|ID$)/.test(key)) out.add(String(v));
      });
    }

    function tableCategory(table, action, details, payload) {
      const t = String(table || '').toLowerCase();
      const d = String(details || '').toLowerCase();
      const itemType = String((payload && (payload.type || payload.jenis)) || '').toLowerCase();
      if (t.includes('partnership') || t.includes('kerja_sama') || t.includes('partner')) return 'PARTNERSHIP';
      if (t.includes('keuangan') || t.includes('finance') || t.includes('keuangan_reset')) return 'KEUANGAN';
      if (t.includes('item') || t.includes('stock') || t.includes('barang')) return 'STOK';
      if (t.includes('pickup')) return 'PENGAMBILAN';
      if (t.includes('transaction') || t.includes('transaksi')) return itemType.includes('masuk') || itemType.includes('in') ? 'BARANG MASUK' : 'BARANG KELUAR';
      if (t.includes('kasbon') || t.includes('setoran')) return 'KASBON & SETORAN';
      if (t.includes('party')) return 'EVENT';
      if (t.includes('member') || t.includes('user') || t.includes('partner')) return 'DATA';
      if (d.includes('partnership')) return 'PARTNERSHIP';
      return 'SISTEM';
    }

    function prettyAction(action, operation) {
      const a = String(action || '').toUpperCase();
      const op = String(operation || '').toUpperCase();
      if (a.includes('DELETE') || op === 'DELETE') return 'DIHAPUS';
      if (a.includes('UPDATE') || op === 'UPDATE') return 'DIPERBARUI';
      if (a.includes('CREATE') || a.includes('INSERT') || op === 'INSERT') return 'DITAMBAHKAN';
      if (a.includes('RESET')) return 'RESET';
      return a.replaceAll('_', ' ') || 'AKTIVITAS';
    }

    auditRows.forEach(function(row) {
      const detailObj = safeJson(row.details);
      const table = detailObj.table || '';
      const operation = detailObj.operation || '';
      const ids = new Set();
      findIds(detailObj, ids);
      ids.forEach(function(id) { auditKnownIds.add(id); });
      const payload = detailObj.new || detailObj.old || {};
      const name = payload.item_name || payload.nama_barang || payload.partner_name || payload.nama_partner || payload.nama || payload.itemName || payload.keterangan || '';
      const amount = payload.total_amount || payload.nominal || payload.amount || payload.harga_jual || payload.harga_mentah;
      const qty = payload.qty || payload.stock;
      let detailText = name ? String(name) : '';
      if (qty !== undefined && qty !== null && qty !== '') detailText += (detailText ? ' · ' : '') + 'Qty/Stok: ' + qty;
      if (amount !== undefined && amount !== null && amount !== '') detailText += (detailText ? ' · ' : '') + 'Nominal: ' + money(Number(amount) || 0);
      if (!detailText) detailText = table ? table.replace(/^ch_/, '').replaceAll('_', ' ') : (row.details || '-');
      all.push({
        id: row.id || '', timestamp: row.timestamp || '',
        category: tableCategory(table, row.action, detailText, payload),
        action: prettyAction(row.action, operation),
        title: (table || 'Aktivitas sistem').replace(/^ch_/, '').replaceAll('_', ' '),
        detail: detailText, actor: row.username || row.userId || 'Sistem', role: row.role || '',
        source: 'AUDIT'
      });
    });

    // Tambahkan data lama dari tabel modul hanya jika ID-nya belum ada di audit,
    // supaya histori lama tetap terlihat tanpa menggandakan transaksi baru.
    transactions.forEach(function(row) {
      const id = String(row.id || '');
      if (id && auditKnownIds.has(id)) return;
      all.push({ id:id, timestamp:row.timestamp || '', category:'BARANG KELUAR', action:String(row.type || 'TRANSAKSI').toUpperCase(),
        title:row.itemName || 'Transaksi barang', detail:(row.keterangan || '-') + ' · Qty: ' + (row.qty || 0),
        actor:row.staffName || '-', role:'', source:'LEGACY' });
    });

    pickups.forEach(function(row) {
      const id = String(row.id || '');
      if (id && auditKnownIds.has(id)) return;
      all.push({ id:id, timestamp:row.timestamp || '', category:'PENGAMBILAN', action:String(row.status || 'PENGAMBILAN').toUpperCase(),
        title:row.itemName || 'Pengambilan barang', detail:'Member: ' + (row.memberName || '-') + ' · Qty: ' + (row.qty || 0),
        actor:row.staffName || '-', role:'', source:'LEGACY' });
    });

    financeRows.forEach(function(row) {
      const id = String(row.id || '');
      if (id && auditKnownIds.has(id)) return;
      all.push({ id:id, timestamp:row.timestamp || '', category:'KEUANGAN', action:String(row.type || 'TRANSAKSI KEUANGAN').toUpperCase(),
        title:row.type === 'PEMASUKAN' ? 'Uang masuk' : 'Uang keluar', detail:(row.keterangan || '-') + ' · ' + money(Number(row.amount) || 0),
        actor:row.nama || '-', role:'', source:'LEGACY' });
    });

    function dateSortValue(value) {
      const m = String(value || '').match(/^(\d{2})\/(\d{2})\/(\d{4})\s*(\d{2})?:?(\d{2})?:?(\d{2})?/);
      if (!m) return 0;
      return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]), Number(m[4]||0), Number(m[5]||0), Number(m[6]||0)).getTime();
    }
    all.sort(function(a,b) { return dateSortValue(b.timestamp) - dateSortValue(a.timestamp); });

    const categories = ['SEMUA AKTIVITAS','KEUANGAN','STOK','BARANG MASUK','BARANG KELUAR','PENGAMBILAN','PARTNERSHIP','KASBON & SETORAN','EVENT','SISTEM'];
    const categoryOptions = categories.map(function(c) { return '<option value="'+escapeAttr(c)+'">'+escapeHTML(c)+'</option>'; }).join('');

    document.getElementById('content').innerHTML = `
      <div class="card" style="margin-bottom:16px;border-color:rgba(201,164,92,.22);background:linear-gradient(135deg,rgba(201,164,92,.07),rgba(18,18,18,.94) 42%)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div><div style="font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:800">CRIMSON HERITAGE / ACTIVITY CENTER</div>
          <div style="font-size:25px;font-weight:900;margin-top:7px">HISTORY <span style="color:var(--gold)">UTAMA</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">Semua aktivitas dalam satu timeline, dari yang terbaru.</div></div>
          <div style="padding:8px 11px;border:1px solid rgba(201,164,92,.28);border-radius:999px;color:var(--gold);font-size:10px;font-weight:800">${number(all.length)} AKTIVITAS</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px">
          <input id="unifiedHistorySearch" placeholder="Cari aktivitas, barang, nominal, pelaku..." autocomplete="off" style="width:100%;min-width:0;padding:12px;border:1px solid var(--border);border-radius:10px;background:#111;color:white">
          <select id="unifiedHistoryCategory" style="width:100%;min-width:0;padding:12px;border:1px solid var(--border);border-radius:10px;background:#111;color:white">${categoryOptions}</select>
        </div>
        <div id="unifiedHistoryCount" style="font-size:11px;color:var(--muted);margin-top:12px">${number(all.length)} aktivitas</div>
      </div>
      <div id="unifiedHistoryList" style="display:grid;gap:10px"></div>
    `;

    function renderUnifiedHistory() {
      const q = String(document.getElementById('unifiedHistorySearch').value || '').toLowerCase().trim();
      const category = document.getElementById('unifiedHistoryCategory').value;
      const filtered = all.filter(function(row) {
        const text = [row.timestamp,row.category,row.action,row.title,row.detail,row.actor,row.role,row.id].join(' ').toLowerCase();
        return (category === 'SEMUA AKTIVITAS' || row.category === category) && (!q || text.includes(q));
      });
      document.getElementById('unifiedHistoryCount').textContent = number(filtered.length) + ' aktivitas';
      document.getElementById('unifiedHistoryList').innerHTML = filtered.map(function(row) {
        const color = row.category === 'KEUANGAN' ? '#7dd9a5' : row.category === 'STOK' || row.category === 'BARANG KELUAR' || row.category === 'PENGAMBILAN' ? '#8cc8ff' : row.category === 'PARTNERSHIP' ? 'var(--gold)' : '#c4b6e8';
        return `<div class="card" style="padding:15px;border-left:3px solid ${color}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div style="min-width:0;flex:1"><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
              <span style="font-size:9px;font-weight:900;letter-spacing:.7px;color:${color};border:1px solid ${color};border-radius:999px;padding:4px 7px">${escapeHTML(row.category)}</span>
              <span style="font-size:9px;color:#aaa">${escapeHTML(row.action)}</span>
            </div><div style="font-size:14px;font-weight:800;overflow-wrap:anywhere">${escapeHTML(row.title || 'Aktivitas')}</div>
            <div style="font-size:12px;color:#aaa;line-height:1.6;margin-top:6px;overflow-wrap:anywhere">${escapeHTML(row.detail || '-')}</div>
            <div style="font-size:10px;color:#888;margin-top:8px">Pelaku: ${escapeHTML(row.actor || 'Sistem')}${row.role ? ' · '+escapeHTML(row.role) : ''}</div></div>
            <div style="font-size:10px;color:#aaa;white-space:nowrap">${escapeHTML(row.timestamp || '-')}</div>
          </div></div>`;
      }).join('') || '<div class="card"><div class="empty">Tidak ada aktivitas yang cocok dengan pencarian ini.</div></div>';
    }
    document.getElementById('unifiedHistorySearch').addEventListener('input', renderUnifiedHistory);
    document.getElementById('unifiedHistoryCategory').addEventListener('change', renderUnifiedHistory);
    renderUnifiedHistory();
  })
  .catch(handleServerError);

}

let CURRENT_PARTNERS = [];
let CURRENT_PARTNER = null;
let CURRENT_PARTNERSHIP_ITEMS = [];

function loadPartnershipPage() {
  let loaded = 0;
  let partners = [];
  let items = [];
  function done() {
    loaded++;
    if (loaded < 2 || CURRENT_PAGE !== 'kerjasama') return;
    CURRENT_PARTNERS = partners || [];
    CURRENT_PARTNERSHIP_ITEMS = (items || []).filter(function(item){ return item && item.id && item.name; });
    renderPartnershipPage_();
    if (CURRENT_PARTNER) refreshPartnerPurchases_();
  }
  google.script.run.withSuccessHandler(function(data){ partners=data||[]; done(); }).withFailureHandler(handleServerError).getPartners(TOKEN);
  google.script.run.withSuccessHandler(function(data){ items=data||[]; done(); }).withFailureHandler(handleServerError).getItemsPublic(TOKEN);
}

function renderPartnershipPage_() {
  let list = '';
  CURRENT_PARTNERS.forEach(function(partner) {
    const active = CURRENT_PARTNER && CURRENT_PARTNER.id === partner.id ? ' active' : '';
    list += `<button class="card partner-card${active}" onclick="selectPartner('${escapeAttr(partner.id)}')">
      <div class="partner-name">${escapeHTML(partner.name)}</div>
      <div class="partner-meta">${escapeHTML(partner.status)} • Mulai ${escapeHTML(formatDateSimple_(partner.startDate))}</div>
    </button>`;
  });
  if (!list) list = `<div class="card empty">Belum ada partner. Tambahkan partner sesuai perjanjian kerja sama.</div>`;

  document.getElementById('content').innerHTML = `
    <div class="partnership-toolbar">
      <div>
        <div style="font-size:12px;color:#888">DAFTAR PARTNER</div>
        <div style="font-size:10px;color:#666;margin-top:4px">Partner aktif bisa dipilih untuk mencatat transaksi dua arah.</div>
      </div>
      <button class="btn btn-red" onclick="openAddPartnerModal()">+ TAMBAH PARTNER</button>
    </div>
    <div class="partnership-list">${list}</div>
    ${CURRENT_PARTNER ? partnershipDetailHTML_(CURRENT_PARTNER) : `
      <div class="card empty">Pilih partner untuk melihat dan mencatat Partnership.</div>
    `}`;
}

function formatDateSimple_(value) {
  if (!value) return '-';
  const p = String(value).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : value;
}

function selectPartner(id) {
  const partner = CURRENT_PARTNERS.find(function(p) { return String(p.id) === String(id); });
  if (!partner) return;
  CURRENT_PARTNER = partner;
  renderPartnershipPage_();
  bindPartnershipCalculators_();
  refreshPartnerPurchases_();
}

function refreshPartnerPurchases_() {
  if (!CURRENT_PARTNER) return;
  google.script.run.withSuccessHandler(function(data) {
    const buy = data && data.buy ? data.buy : [];
    const sell = data && data.sell ? data.sell : [];
    const buyEl = document.getElementById('partnerBuyHistory');
    const sellEl = document.getElementById('partnerSellHistory');
    const totalBuy = buy.reduce(function(sum,r){ return sum + (Number(r.totalAmount)||0); }, 0);
    const totalSell = sell.reduce(function(sum,r){ return sum + (Number(r.totalAmount)||0); }, 0);
    const summary = document.getElementById('partnerFinanceSummary');
    if (summary) summary.innerHTML = `
      <div class="grid grid-2" style="margin-bottom:12px">
        <div class="card" style="padding:13px;border-left:3px solid var(--danger)">

          <div style="font-size:17px;font-weight:900;margin-top:4px">${partnershipMoney_(totalBuy)}</div>
        </div>
        <div class="card" style="padding:13px;border-left:3px solid var(--green)">
          <div style="font-size:9px;color:#888">UANG MASUK • MEREKA MEMBELI</div>
          <div style="font-size:17px;font-weight:900;margin-top:4px">${partnershipMoney_(totalSell)}</div>
        </div>
      </div>`;
    if (buyEl) buyEl.innerHTML = purchaseHistoryHTML_(buy, 'Belum ada pembelian kita.', false);
    if (sellEl) sellEl.innerHTML = purchaseHistoryHTML_(sell, 'Belum ada pembelian mereka.', true);
  }).withFailureHandler(handleServerError).getPartnershipPurchases(TOKEN, CURRENT_PARTNER.id);
}

function purchaseHistoryHTML_(rows, emptyText, isSell) {
  if (!rows.length) return `<div style="font-size:9px;color:#666;padding:10px 0">${emptyText}</div>`;
  const admin = USER && String(USER.role || '').toUpperCase() === 'ADMIN';
  const direction = isSell ? 'SELL' : 'BUY';
  const groups = new Map();
  rows.forEach(function(r) {
    const rawNote = String(r.note || '');
    const gm = rawNote.match(/\[\[CH_INVOICE_GROUP:([^\]]+)\]\]/i);
    const key = gm ? gm[1] : r.id; // legacy single-line transactions remain individually visible
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });
  const grouped = Array.from(groups.entries()).map(function(entry) {
    const key = entry[0], lines = entry[1];
    const first = lines[0];
    const amount = lines.reduce(function(sum,r){ return sum + (Number(r.totalAmount)||0); },0);
    const qty = lines.reduce(function(sum,r){ return sum + (Number(r.qty)||0); },0);
    const names = lines.map(function(r){return String(r.itemName || 'Barang');});
    const rawNotes = lines.map(function(r){return String(r.note || '');});
    const statusMatches = rawNotes.map(function(n){return n.match(/\[\[CH_INVOICE_STATUS:(PAID|UNPAID)\]\]/i);}).filter(Boolean);
    const status = statusMatches.some(function(m){return m[1].toUpperCase()==='UNPAID';}) ? 'UNPAID' :
      (statusMatches.length && statusMatches.length===lines.length && statusMatches.every(function(m){return m[1].toUpperCase()==='PAID';}) ? 'PAID' :
      (statusMatches.length ? 'UNPAID' : 'UNKNOWN'));
    const cleanNote = rawNotes[0].replace(/\s*\[\[CH_INVOICE_STATUS:(?:PAID|UNPAID)\]\]/ig,'').replace(/\s*\[\[CH_INVOICE_GROUP:[^\]]+\]\]/ig,'').trim();
    return {key:key, lines:lines, first:first, amount:amount, qty:qty, names:names, status:status, cleanNote:cleanNote};
  });
  return `<div class="table-wrap"><table style="min-width:${admin ? '980px' : '850px'}"><thead><tr><th>Invoice</th><th>Daftar Barang</th><th>Total Qty</th><th>Total Invoice</th><th>Tanggal</th><th>Keterangan</th>${admin ? '<th>Aksi Admin</th>' : ''}</tr></thead><tbody>` +
    grouped.map(function(g) {
      const r = g.first;
      const statusLabel = g.status==='PAID'?'LUNAS':g.status==='UNPAID'?'BELUM LUNAS':'STATUS BELUM DIATUR';
      const itemSummary = g.lines.map(function(line){return escapeHTML(line.itemName)+' × '+number(line.qty);}).join('<br>');
      const invoicePayload = encodeURIComponent(JSON.stringify({
        id: g.key,
        partnerName: r.partnerName || (CURRENT_PARTNER && CURRENT_PARTNER.name) || '',
        date: r.date || '',
        status: g.status,
        note: g.cleanNote || '',
        lines: g.lines
      }));
      const invoiceButton = `<button class="btn btn-gold" style="padding:7px 9px;font-size:9px" onclick="openPartnershipInvoiceGroupPayload_('${invoicePayload}')">LIHAT NOTA INVOICE (${g.lines.length} BARANG)</button><div style="font-size:8px;color:${g.status==='PAID'?'#37c978':g.status==='UNPAID'?'#e5b94d':'#aaa'};margin-top:5px">${statusLabel}</div>`;
      // Admin actions are invoice-level: one edit and one delete for the whole grouped invoice.
      const adminActions = admin ? `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-muted" style="padding:7px 9px;font-size:9px" onclick="editPartnershipInvoiceGroup_('${escapeAttr(encodeURIComponent(JSON.stringify({id:g.key,partnerId:r.partnerId||'',partnerName:r.partnerName||'',date:r.date||'',status:g.status,note:g.cleanNote||'',direction:direction,lines:g.lines})))}')">EDIT INVOICE</button>
        <button class="btn btn-danger" style="padding:7px 9px;font-size:9px" onclick="deletePartnershipInvoiceGroup_('${escapeAttr(g.key)}','${direction}')">HAPUS INVOICE</button>
      </div>` : '';
      return `<tr><td>${invoiceButton}</td><td>${itemSummary}</td><td>${number(g.qty)}</td><td><strong>Rp ${number(g.amount)}</strong></td><td>${escapeHTML(r.date)}</td><td>${escapeHTML(g.cleanNote || '-')}</td>${admin ? `<td>${adminActions}</td>` : ''}</tr>`;
    }).join('') +
    `</tbody></table></div>`;
}

function openPartnershipInvoiceGroupPayload_(payload) {
  try {
    const data = JSON.parse(decodeURIComponent(payload));
    openPartnershipInvoiceGroup_(data.id, data.partnerName, data.date, data.status, data.note, data.lines || []);
  } catch (e) {
    toast('Nota invoice tidak dapat dibuka. Muat ulang halaman lalu coba lagi.', 'error');
    console.error('Invoice payload error', e);
  }
}

function openPartnershipInvoiceGroup_(invoiceId, partnerName, date, status, note, lines) {
  const safe = function(v){ return escapeHTML(String(v == null ? '' : v)); };
  const money = function(v){ return 'Rp ' + (Number(v)||0).toLocaleString('id-ID'); };
  const total = (lines || []).reduce(function(sum,l){return sum+(Number(l.totalAmount)||0);},0);
  const totalQty = (lines || []).reduce(function(sum,l){return sum+(Number(l.qty)||0);},0);
  const statusLabel = status==='PAID'?'LUNAS':status==='UNPAID'?'BELUM DIBAYAR':'STATUS BELUM DIATUR';
  const logo = new URL('assets/crimson-brand.webp', location.href).href;
  const rows = (lines || []).map(function(l,i){return `<tr><td>${i+1}</td><td>${safe(l.itemName)}</td><td>${Number(l.qty)||0}</td><td>${money(l.unitPrice)}</td><td class="right">${money(l.totalAmount)}</td></tr>`;}).join('');

// Dipanggil dari jendela invoice agar status pembayaran bisa diubah dan disimpan ke riwayat.
function updatePartnershipInvoiceStatus_(id, status, amount, cleanNote, invoiceWin) {
  if (!USER || String(USER.role || '').toUpperCase() !== 'ADMIN') { toast('Perubahan status invoice khusus ADMIN.', 'error'); return; }
  status = status === 'PAID' ? 'PAID' : 'UNPAID';
  const note = (String(cleanNote || '').replace(/\s*\[\[CH_INVOICE_STATUS:(?:PAID|UNPAID)\]\]/ig, '').trim() + ' [[CH_INVOICE_STATUS:' + status + ']]').trim();
  google.script.run.withSuccessHandler(function(result) {
    toast(result.message || 'Status pembayaran invoice berhasil disimpan.', 'success');
    const label = status === 'PAID' ? 'LUNAS' : 'BELUM DIBAYAR';
    if (invoiceWin && !invoiceWin.closed) {
      const badge = invoiceWin.document.getElementById('invoiceStatusBadge');
      const value = invoiceWin.document.getElementById('invoiceStatusValue');
      const totalStatus = invoiceWin.document.getElementById('invoiceTotalStatus');
      if (badge) badge.textContent = label;
      const invoiceCard = invoiceWin.document.querySelector('.invoice');
      if (invoiceCard) { invoiceCard.classList.toggle('is-paid', status === 'PAID'); invoiceCard.classList.toggle('is-unpaid', status === 'UNPAID'); }
      if (value) { value.textContent = label; value.style.color = status === 'PAID' ? '#16824a' : '#9a711e'; }
      if (totalStatus) { totalStatus.textContent = label; totalStatus.className = 'paid-pill ' + (status === 'PAID' ? 'is-paid' : 'is-unpaid'); }
    }
    if (typeof pageCacheClearPages === 'function') pageCacheClearPages(['kerjasama','finance','dashboard','history']);
    refreshPartnerPurchases_();
  }).withFailureHandler(handleServerError).updatePartnershipPurchase(TOKEN, id, Number(amount) || 0, note);
}

function partnershipMoney_(value) {
  const n = Number(value) || 0;
  return 'Rp ' + n.toLocaleString('id-ID');
}

function addPartnershipLine_(prefix) {
  const host = document.getElementById(prefix + 'Lines'); if (!host) return;
  const options = (CURRENT_PARTNERSHIP_ITEMS || []).map(function(item) {
    return `<option value="${escapeAttr(item.id)}">${escapeHTML(item.name)}</option>`;
  }).join('');
  const row = document.createElement('div'); row.className = 'partnership-line grid grid-2';
  row.style.cssText = 'border:1px solid rgba(199,164,91,.25);border-radius:10px;padding:10px;margin:8px 0;position:relative';
  row.innerHTML = `<div class="field"><label>Barang</label><select class="pl-item"><option value="">Pilih barang...</option>${options}</select></div>
    <div class="field"><label>Jumlah</label><input class="pl-qty" type="number" min="1" step="1" placeholder="0"></div>
    <div class="field"><label>Harga satuan (Rp, boleh 0)</label><input class="pl-price" type="number" min="0" step="1" placeholder="0"></div>
    <div class="field"><label>Subtotal</label><input class="pl-subtotal" type="text" value="Rp 0" readonly></div>
    <button type="button" class="btn btn-danger" style="grid-column:1/-1" onclick="this.closest('.partnership-line').remove();updatePartnershipTotal_('${prefix}')">HAPUS BARANG</button>`;
  row.querySelectorAll('.pl-qty,.pl-price').forEach(function(el){el.addEventListener('input',function(){updatePartnershipTotal_(prefix);});});
  host.appendChild(row); updatePartnershipTotal_(prefix);
}
function updatePartnershipTotal_(prefix) {
  let total = 0;
  document.querySelectorAll('#' + prefix + 'Lines .partnership-line').forEach(function(row){
    const qty = Number(row.querySelector('.pl-qty')?.value || 0);
    const price = Number(row.querySelector('.pl-price')?.value || 0);
    const subtotal = qty * price; total += subtotal;
    const el = row.querySelector('.pl-subtotal'); if (el) el.value = partnershipMoney_(subtotal);
  });
  const out = document.getElementById(prefix + 'Total'); if (out) out.value = partnershipMoney_(total);
}
function bindPartnershipCalculators_() {
  ['pb','ps'].forEach(function(prefix){
    const host = document.getElementById(prefix + 'Lines');
    if (host && !host.querySelector('.partnership-line')) addPartnershipLine_(prefix);
  });
}
function savePartnerPurchase(direction) {
  if (!CURRENT_PARTNER) return;
  const prefix = direction === 'BUY' ? 'pb' : 'ps';
  const date = document.getElementById(prefix + 'Date')?.value || '';
  const note = document.getElementById(prefix + 'Note')?.value || '';
  const lines = Array.from(document.querySelectorAll('#' + prefix + 'Lines .partnership-line')).map(function(row){
    return {item:row.querySelector('.pl-item')?.value || '',qty:Number(row.querySelector('.pl-qty')?.value || 0),price:Number(row.querySelector('.pl-price')?.value || 0)};
  }).filter(function(x){return x.item || x.qty || x.price;});
  if (!date || !lines.length || lines.some(function(x){return !x.item || !Number.isInteger(x.qty) || x.qty <= 0 || !Number.isFinite(x.price) || x.price < 0;})) {
    toast('Isi tanggal dan setiap barang dengan jumlah minimal 1 serta harga 0 atau lebih.', 'error'); return;
  }
  const groupId = 'INV-' + Date.now().toString(36).toUpperCase();
  const total = lines.reduce(function(a,x){return a+x.qty*x.price;},0);
  // One RPC call: backend validates and commits every line atomically. Do not retry on failure without checking history.
  google.script.run.withSuccessHandler(function(result){
    toast((result && result.message) || ('Invoice ' + groupId + ' berhasil disimpan.'), 'success');
    const host = document.getElementById(prefix + 'Lines');
    if (host) host.innerHTML = '';
    addPartnershipLine_(prefix);
    ['Date','Note'].forEach(function(k){const e=document.getElementById(prefix+k);if(e)e.value='';});
    if (typeof pageCacheClearPages === 'function') pageCacheClearPages(['kerjasama','stock','finance','dashboard','history']);
    refreshPartnerPurchases_();
  }).withFailureHandler(function(err){
    toast('Invoice gagal disimpan dan seluruh perubahan backend dibatalkan. Cek pesan: ' + (err && err.message ? err.message : 'kesalahan server'), 'error');
  }).addPartnershipInvoice(TOKEN, direction, CURRENT_PARTNER.id, lines, date, note, groupId);
}

}

    .getElementById('modal')
    .classList.remove('show');

}


/* =====================================================

===================================================== */

function runPromise(
  functionName,
  args
) {

  return new Promise(function(resolve, reject) {

    let runner =
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

    runner[functionName].apply(
      runner,
      args
    );

  });

}


function getItemsPromise() {

  return runPromise(

/* =====================================================
   UI HELPERS
===================================================== */

function statCard(
  label,
  value,
  className
) {

  return `
    <div class="card">

      <div class="stat-label">
        ${label}
      </div>

      <div class="stat-value ${className}">
        ${value}
      </div>

    </div>
  `;

}


function itemCard(item) {

  return `
    <div class="card item-card">

      <div class="item-name">
        ${escapeHTML(item.name)}
      </div>

      <div class="item-stock">
        ${number(item.stock)}
      </div>

      <div class="item-min">
        Minimum: ${number(item.minimum)}
      </div>

      ${statusBadge(item.status)}

    </div>
  `;

}


function statusBadge(status) {

  const value =
    String(status || '')
      .toUpperCase();

  let cls = 'available';

  if (
    value.includes('OUT') ||
    value === 'INACTIVE' ||
    value === 'CANCELLED'
  ) {

    cls = 'out';

  } else if (
    value.includes('LOW') ||
    value === 'PENDING' ||
    value === 'BELUM LUNAS'
  ) {

    cls = 'low';

  } else if (
    value === 'ACTIVE' ||
    value === 'AVAILABLE' ||
    value === 'LUNAS' ||
    value === 'PROCESSED' ||
    value === 'PEMASUKAN'
  ) {

    cls = 'available';

  } else if (
    value === 'PENGELUARAN'
  ) {

    cls = 'out';

  }

  return `
    <span class="status ${cls}">
      ${escapeHTML(value || '-')}
    </span>
  `;

}


function invalidatePageCache() {
  pageCacheClearPages.apply(null, arguments);
}

function loadingHTML() {

  return `
    <div class="card">

      <div class="empty">
        MEMUAT DATA...
      </div>

    </div>
  `;

}

   SIDEBAR
===================================================== */

function toggleSidebar() {

  document
    .getElementById('sidebar')
    .classList.toggle('open');

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutApp() {

  google.script.run

    .withSuccessHandler(function() {

      TOKEN = '';
      USER = null;

      storageRemove_(
        'CH_TOKEN'
      );

      showLogin();

    })

    .withFailureHandler(function() {

      TOKEN = '';
      USER = null;

      storageRemove_(
        'CH_TOKEN'
      );

      showLogin();

    })

    .logout(TOKEN);

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function toast(
  message,
  type
) {

  const el =
    document.getElementById(
      'toast'
    );

  el.textContent =
    message;

  el.className =
    'show ' +
    (type || '');

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(function() {

      el.className = '';

    }, 3500);

}


/* =====================================================
   ERROR
===================================================== */

function handleServerError(err) {
  const message = getErrorMessage(err);

  if (isSessionError_(message)) {
    forceLogout_('Sesi berakhir. Silakan login kembali.');
    return;
  }

  toast(message || 'Terjadi kesalahan.', 'error');
}


function isSessionError_(message) {
  const text = String(message || '').toUpperCase();
  // ACCESS_DENIED bukan berarti session expired.
  // Jangan logout user hanya karena permission menu/fungsi ditolak.
  return text.includes('SESSION_REQUIRED') ||
         text.includes('SESSION_EXPIRED');
}

function forceLogout_(message) {
  TOKEN = '';
  USER = null;
  storageRemove_('CH_TOKEN');
  showLogin();

  const error = document.getElementById('loginError');
  if (error && message) {
    error.textContent = message;
    error.style.display = 'block';
  }
}

function getErrorMessage(err) {

  if (!err) {
    return 'Terjadi kesalahan.';
  }

  if (typeof err === 'string') {
    return err;
  }

  return (
    err.message ||
    'Terjadi kesalahan pada server.'
  );

}


/* =====================================================
   FORMATTING
===================================================== */

function money(value) {

  return 'Rp ' +
    Number(value || 0)
      .toLocaleString(
        'id-ID'
      );

}


function number(value) {

  return Number(value || 0)
    .toLocaleString(
      'id-ID'
    );

}


/* =====================================================
   SECURITY / ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeAttr(value) {

  return escapeHTML(value);

}


/* =====================================================
   CLOSE MODAL ON BACKDROP
===================================================== */

document
  .getElementById('modal')
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        closeModal();

      }

    }
  );

</script>

<script id="ch-cinematic-royal-audio-script">
(function(){
  'use strict';
  var audio=document.getElementById('chRoyalAudio');
  var control=document.getElementById('chRoyalAudioControl');
  var playButton=document.getElementById('chRoyalPlayPause');
  var muteButton=document.getElementById('chRoyalMute');
  var toggleButton=document.getElementById('chRoyalToggle');
  if(!audio||!control||!playButton||!muteButton||!toggleButton) return;
  var muted=false;
  var dragState=null;
  var suppressToggle=false;
  audio.volume=0.35;
  audio.loop=true;
  try{
    var saved=JSON.parse(localStorage.getItem('chRoyalAudioPosition')||'null');
    if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top)){
      control.style.left=Math.max(4,Math.min(window.innerWidth-44,saved.left))+'px';
      control.style.top=Math.max(4,Math.min(window.innerHeight-44,saved.top))+'px';
      control.style.right='auto';control.style.bottom='auto';
    }
  }catch(e){}
  toggleButton.addEventListener('click',function(){
    if(suppressToggle){suppressToggle=false;return;}
    var collapsed=control.classList.toggle('is-collapsed');
    toggleButton.setAttribute('aria-label',collapsed?'Buka kontrol musik; geser untuk memindahkan':'Tutup kontrol musik; geser untuk memindahkan');
    toggleButton.title=collapsed?'Buka kontrol musik — geser untuk memindahkan':'Tutup kontrol musik — geser untuk memindahkan';
  });
  toggleButton.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    var rect=control.getBoundingClientRect();
    dragState={id:e.pointerId,startX:e.clientX,startY:e.clientY,left:rect.left,top:rect.top,moved:false};
    try{toggleButton.setPointerCapture(e.pointerId);}catch(err){}
  });
  toggleButton.addEventListener('pointermove',function(e){
    if(!dragState||dragState.id!==e.pointerId)return;
    var dx=e.clientX-dragState.startX,dy=e.clientY-dragState.startY;
    if(!dragState.moved&&Math.hypot(dx,dy)<6)return;
    dragState.moved=true;suppressToggle=true;
    var left=Math.max(4,Math.min(window.innerWidth-control.offsetWidth-4,dragState.left+dx));
    var top=Math.max(4,Math.min(window.innerHeight-control.offsetHeight-4,dragState.top+dy));
    control.style.left=left+'px';control.style.top=top+'px';control.style.right='auto';control.style.bottom='auto';
  });
  function finishDrag(e){
    if(!dragState||dragState.id!==e.pointerId)return;
    var moved=dragState.moved;dragState=null;
    if(moved){try{localStorage.setItem('chRoyalAudioPosition',JSON.stringify({left:control.getBoundingClientRect().left,top:control.getBoundingClientRect().top}));}catch(err){}setTimeout(function(){suppressToggle=false;},0);}
  }
  toggleButton.addEventListener('pointerup',finishDrag);
  toggleButton.addEventListener('pointercancel',finishDrag);
  window.addEventListener('resize',function(){
    if(control.style.left){var r=control.getBoundingClientRect();control.style.left=Math.max(4,Math.min(window.innerWidth-control.offsetWidth-4,r.left))+'px';control.style.top=Math.max(4,Math.min(window.innerHeight-control.offsetHeight-4,r.top))+'px';}
  });
  function sync(){
    var playing=!audio.paused&&!audio.ended;
    control.classList.toggle('is-playing',playing);
    toggleButton.textContent=playing?'♫':'♪';
    playButton.textContent=playing?'Ⅱ':'▶';
    playButton.setAttribute('aria-label',playing?'Jeda musik':'Putar musik');
    playButton.title=playing?'Jeda musik':'Putar musik';
    muteButton.textContent=muted?'×':'♫';
    muteButton.setAttribute('aria-pressed',String(muted));
    muteButton.setAttribute('aria-label',muted?'Nyalakan suara':'Matikan suara');
    muteButton.title=muted?'Nyalakan suara':'Matikan suara';
  }
  function startAudio(){
    audio.volume=0.35;
    var p=audio.play();
    if(p&&typeof p.then==='function'){
      p.then(function(){started=true;sync();}).catch(function(){
        sync();
        control.setAttribute('title','Browser memerlukan klik untuk memulai musik.');
      });
    }else{started=true;sync();}
  }
  playButton.addEventListener('click',function(){
    if(audio.paused){startAudio();}
    else{audio.pause();sync();}
  });
  muteButton.addEventListener('click',function(){
    muted=!muted;
    audio.muted=muted;
    sync();
  });
  audio.addEventListener('play',sync);
  audio.addEventListener('pause',sync);
  audio.addEventListener('ended',sync);
  // No autoplay: playback starts only after the visitor presses Play.
  sync();
})();
</script>
